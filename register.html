<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Apply saved UI before the first visible frame, including slow loads. -->
  <script>document.documentElement.dataset.uiReady = 'false';</script>
  <style>html[data-ui-ready="false"] body { visibility: hidden; }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Resident Evil</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="site.css">
  <script defer blocking="render" src="script.js"></script>
  <script defer blocking="render" src="lang.js"></script>
  <script defer blocking="render" src="site-shell.js"></script>
  <script defer blocking="render" src="register.js"></script>
  <script defer blocking="render" src="transition.js"></script>
  <script defer blocking="render" src="ui-ready.js"></script>
</head>
<body>

<header>
  <nav aria-label="Main navigation">
    <h1><a href="index.html" class="site-brand">Resident Evil</a></h1>
    <ul>
      <li><a href="index.html" data-translate="nav-home">Home</a></li>
      <li><a href="games.html" data-translate="nav-games">Games</a></li>
      <li><a href="characters.html" data-translate="nav-characters">Characters</a></li>
      <li><a href="top-games.html" data-translate="nav-top">Top games</a></li>
      <li class="user-profile"><a href="register.html" class="profile-link"><span class="user-icon" aria-hidden="true">◉</span><span class="user-name">Choose a nickname</span></a></li>
      <li class="lang-switcher"><button type="button" onclick="setLang('en')" class="lang-btn" id="btn-en">EN</button><span aria-hidden="true">|</span><button type="button" onclick="setLang('ru')" class="lang-btn" id="btn-ru">RU</button></li>
    </ul>
  </nav>
</header>

<main>
<div class="page-toolbar"><a href="index.html" class="page-back" data-page-back data-site-copy="back">← Back</a><a href="index.html" class="page-home" data-site-copy="home">Home</a></div>
  <section class="register-page">
    <div class="register-container">
      
      <div class="register-header">
        <h2 data-translate="register-title">Your player profile</h2>
        <p data-translate="register-subtitle">Choose a nickname before playing. This local profile is not a server account.</p>
      </div>

      <form id="register-form" class="register-form" novalidate>
        
        <div class="form-group">
          <label for="name" data-translate="register-name">Name *</label>
          <input 
            type="text" 
            id="name" minlength="2" maxlength="30" required autocomplete="nickname"
            name="name"
            data-translate="register-name-placeholder"
            placeholder="Enter your nickname"
          >
          <span class="error-message" id="name-error" role="alert" hidden></span>
        </div>

        <button type="submit" class="register-btn" data-translate="register-btn">
          Save nickname
        </button>



      </form>
      <p id="profile-hint" class="profile-hint" data-site-copy="hint"></p>
      <p id="profile-status" class="profile-status" role="status" hidden></p>
      <div class="profile-actions"><a href="games.html" class="site-button" data-site-copy="continue">Go to mini-games</a><button type="button" id="clear-profile" class="site-button secondary" data-site-copy="clear">Remove nickname</button></div>
    </div>
  </section>
</main>

<footer>
  <p data-translate="footer-text">© 2026 Resident Evil Fan Website</p>
</footer>





</body>
</html>
